# mise configuration for dotfiles project
# mise (formerly rtx) - Runtime version manager

# Tools required for this project
[tools]
shellcheck = "latest"

'aqua:anthropics/claude-code' = '2'
gh = '2'

# Mac Mini provisioning (ansible/) — ansible-core only: the playbooks use builtin
# modules, so the full collections bundle isn't needed. `uv` is the backend that
# mise uses to install the pipx package (avoids depending on a system pipx).
uv = 'latest'
'pipx:ansible-core' = 'latest'

# Environment variables
[env]
# Android SDK Command Line Tools version
ANDROID_CMD_TOOLS_VERSION = "13114758"

