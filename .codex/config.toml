# Project-scoped Codex CLI config — versioned in the repo (like .claude/settings.json).
# Codex only reads this file when the project is TRUSTED (it asks "trust this folder?"
# on the 1st run). Skills and AGENTS.md are read natively — they need no config here.
#
# Contains: permissions (sandbox + approval) and the hooks. Command denies live in the
# execpolicy in .codex/rules/ (equivalent to Claude's `deny`). This project does NOT use
# MCP servers, so there is no [mcp_servers] block (mirrors Claude, which also has no .mcp.json).

# ═══════════════════════════════════════════════════════════════════════════════
# Permissions — equivalent to the `permissions` in .claude/settings.json
# ═══════════════════════════════════════════════════════════════════════════════
# workspace-write + on-request = Codex reads, edits and runs commands IN the workspace
# without asking; it only asks for approval to ESCAPE the sandbox (writing outside the
# repo — e.g. `./dotfiles` writing to $HOME — or disallowed network). Analogous to Claude's allow-list.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true # ≈ unrestricted Bash in Claude (network without prompts, for mise install etc.)
# No extra writable_roots: the dotfiles is a standalone repo. Writing to $HOME (real
# installation via ./dotfiles) escapes the sandbox on purpose and goes through approval.

# ═══════════════════════════════════════════════════════════════════════════════
# Hooks — equivalent to the PostToolUse in .claude/settings.json (lint on-edit)
# ═══════════════════════════════════════════════════════════════════════════════
# Runs shellcheck on the edited file after each apply_patch (Codex's editing tool).
# Mirrors .claude/hooks/lint.sh. The git-root path keeps the hook stable even when run
# from a subdirectory. The full lint stays in `mise run lint`.
[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/lint.sh"'
timeout = 60
