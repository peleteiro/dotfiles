---
# Master playbook — provisions ALL machines.
#
#   mise run ansible                      # all machines
#   mise run ansible -- --limit macmini   # a single machine (or --limit homeassistant)
#   mise run ansible -- --check           # dry-run
#
# Each machine has its own playbook (targets its own group and lists its roles).
# Adding a machine = create the playbook, import it here and register it in the inventory.
- import_playbook: macmini.yml
