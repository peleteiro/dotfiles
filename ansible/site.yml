---
# Playbook mestre — provisiona TODAS as máquinas.
#
#   mise run ansible                      # todas as máquinas
#   mise run ansible -- --limit macmini   # só uma máquina (ou --limit homeassistant)
#   mise run ansible -- --check           # dry-run
#
# Cada máquina tem seu próprio playbook (targeta o próprio grupo e lista suas roles).
# Adicionar uma máquina = criar o playbook, importá-lo aqui e cadastrá-la no inventory.
- import_playbook: macmini.yml
