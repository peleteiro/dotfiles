# Ansible Galaxy collections.
#
# community.general: `homebrew` and `osx_defaults` modules (docker + macos-autologin roles).
# The ssh-keys role uses only builtin modules.
#
# Install: `ansible-galaxy collection install -r requirements.yml`
collections:
  - name: community.general
    version: ">=9.0.0,<12.0.0"
