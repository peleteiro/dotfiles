---
# Usuário que loga automaticamente no boot (para o LaunchAgent do Colima subir).
macos_autologin_user: "{{ ansible_user }}"

# Senha de login usada para escrever /etc/kcpassword. Por padrão reaproveita a senha de
# sudo (ansible_become_password), definida no group_vars/all/secrets.yml (gitignored).
macos_login_password: "{{ ansible_become_password | default('') }}"
