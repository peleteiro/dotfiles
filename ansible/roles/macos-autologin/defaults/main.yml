---
# User that logs in automatically at boot (so the Colima LaunchAgent comes up).
macos_autologin_user: "{{ ansible_user }}"

# Login password used to write /etc/kcpassword. By default reuses the sudo password
# (ansible_become_password), defined in group_vars/all/secrets.yml (gitignored).
macos_login_password: "{{ ansible_become_password | default('') }}"
