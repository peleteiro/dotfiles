---
# Enables macOS auto-login for the service user, so that the GUI session (and with it
# the Colima LaunchAgent) comes up at boot without anyone typing a password.
#
# ⚠️ Requires FileVault OFF: with FileVault, macOS ignores auto-login (requires unlock
#    at boot). On a headless server macmini, FileVault is normally off.

- name: Set the auto-login user (com.apple.loginwindow)
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.loginwindow
    key: autoLoginUser
    type: string
    value: "{{ macos_autologin_user }}"
  become: true

- name: Require the login password to write /etc/kcpassword
  ansible.builtin.assert:
    that:
      - macos_login_password | length > 0
    fail_msg: >-
      I need {{ macos_autologin_user }}'s login password for auto-login. Set
      ansible_become_password (or macos_login_password) in group_vars/all/secrets.yml.
    quiet: true

# /etc/kcpassword stores the auto-login password obfuscated (XOR with a fixed macOS cipher).
# We ALWAYS write the correct value, but idempotently: we decode the current file
# and only rewrite it if it differs (avoids the bug of an old/wrong kcpassword lingering).
- name: Ensure /etc/kcpassword has the correct password
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-c"
      - |
        import os, sys
        pw = sys.argv[1]
        key = [0x7D, 0x89, 0x52, 0x23, 0xD2, 0xBC, 0xDD, 0xEA, 0xA3, 0xB9, 0x1F]
        b = list(pw.encode("utf-8"))
        b += [0] * (12 - len(b) % 12)  # padding: next multiple of 12 (extra block if already one)
        enc = bytes(c ^ key[i % len(key)] for i, c in enumerate(b))
        p = "/etc/kcpassword"
        cur = open(p, "rb").read() if os.path.exists(p) else b""
        if cur != enc:
            fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
            os.write(fd, enc)
            os.close(fd)
            print("changed")
      - "{{ macos_login_password }}"
  become: true
  no_log: true
  register: _kcpassword
  changed_when: "'changed' in _kcpassword.stdout"
