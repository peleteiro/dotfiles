---
# Keeps the macmini from sleeping (always-on headless server). `pmset` persists the
# configuration; idempotent: only applies the setting that isn't at the desired value yet.

- name: Read current power configuration
  ansible.builtin.command: pmset -g custom
  register: _pmset
  changed_when: false
  check_mode: false # must run even in --check for the when below to work
  become: true

- name: Apply "never sleep" (pmset -a)
  ansible.builtin.command: "pmset -a {{ item.key }} {{ item.value }}"
  loop: "{{ nosleep_pmset | dict2items }}"
  become: true
  vars:
    # matches the "<setting>   <value>" line in the pmset output (multiline).
    _pat: '(?m)^\s*{{ item.key }}\s+{{ item.value }}\b'
  when: not (_pmset.stdout is search(_pat))
  changed_when: true
