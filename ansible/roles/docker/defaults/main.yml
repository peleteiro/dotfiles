---
# Homebrew packages for the headless container runtime (macOS).
homebrew_docker_packages:
  - colima # Lima VM + Docker daemon, runs headless (no GUI, unlike Desktop)
  - docker # `docker` CLI (formula, not the Docker Desktop cask)
  - docker-compose # `docker compose` plugin
  - docker-buildx # `docker buildx` plugin

# Colima VM specs. cpu/memory/disk are reconciled on every run (a change restarts
# the VM). disk only GROWS — Colima doesn't shrink disks; lowering the value has no effect.
colima_cpu: 2
colima_memory: 4 # GB
colima_disk: 60 # GB

# VM networking. address=true gives the VM its own IP (vzNAT on Apple Silicon, no sudo).
# preferredRoute=true is mandatory alongside it: without it the default route keeps going
# through gvproxy (192.168.5.x), which refuses LAN traffic — containers can't reach
# devices on the network (NVR, cameras) even with address enabled.
colima_network_address: false
colima_network_preferred_route: false

# VM acceleration (Apple Silicon only). rosetta=true runs amd64 containers at near-native
# speed (instead of qemu user-mode). nested_virtualization requires M3+.
# The GPU is NOT passthrough-able to the Linux VM (Apple Virtualization.framework
# limitation) — jobs needing Metal/VideoToolbox must run on the host, outside the container.
colima_rosetta: false
colima_nested_virtualization: false
