---
# `colima restart` re-reads ~/.colima/default/colima.yaml — cpu/memory/network only take
# effect after it. Triggered when the reconciliation task changes the config.
- name: Restart Colima
  ansible.builtin.command:
    cmd: colima restart
  environment:
    PATH: "{{ _brew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
