---
# Headless Docker on macOS via Colima. Docker Desktop needs a GUI session and isn't
# script-friendly; Colima runs as a LaunchAgent in the auto-logged-in session (see the
# macos-autologin role). Homebrew refuses to run as root → these tasks do NOT use become.

- name: Detect architecture (brew prefix and VM type)
  ansible.builtin.set_fact:
    # Apple Silicon: brew in /opt/homebrew and VM via Virtualization.framework (vz, fast).
    # Intel: brew in /usr/local and VM via qemu.
    _brew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"
    _colima_vm_type: "{{ 'vz' if ansible_facts['architecture'] == 'arm64' else 'qemu' }}"

# ── Remove Docker Desktop (conflicts with Colima's socket/CLI) ──────────────────
# The native uninstaller (runs with become) removes the app and the system files. We
# don't use `brew uninstall --cask` because it calls an internal `sudo` without a tty and fails.
- name: Is Docker Desktop installed?
  ansible.builtin.stat:
    path: /Applications/Docker.app
  register: _docker_desktop

- name: Run the native Docker Desktop uninstaller (if present)
  ansible.builtin.command:
    cmd: /Applications/Docker.app/Contents/MacOS/uninstall
  become: true
  when: _docker_desktop.stat.exists
  register: _dd_uninstall
  changed_when: _dd_uninstall.rc == 0
  failed_when: false

- name: Remove leftover Docker.app
  ansible.builtin.file:
    path: /Applications/Docker.app
    state: absent
  become: true
  when: _docker_desktop.stat.exists

# ── Install/update Colima + Docker CLI ──────────────────────────────────────────
- name: Install/update Colima + Docker (Homebrew)
  community.general.homebrew:
    name: "{{ homebrew_docker_packages }}"
    state: latest # "updated": upgrades when there's a new version
    update_homebrew: true

# Docker Desktop leftover: ~/.docker/config.json points credsStore="desktop", whose
# helper (docker-credential-desktop) disappears with Desktop — breaks `docker pull/run`.
- name: Remove orphaned "desktop" credsStore from ~/.docker/config.json
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "-c"
      - |
        import json, os, sys
        p = os.path.expanduser("~/.docker/config.json")
        if not os.path.exists(p):
            sys.exit(0)
        d = json.load(open(p))
        changed = False
        if d.get("credsStore") == "desktop":
            d.pop("credsStore")
            changed = True
        for k, v in list(d.get("credHelpers", {}).items()):
            if v == "desktop":
                d["credHelpers"].pop(k)
                changed = True
        if changed:
            json.dump(d, open(p, "w"), indent=2)
            print("changed")
  register: _docker_cfg
  changed_when: "'changed' in _docker_cfg.stdout"

# ── Bring up the VM and ensure autostart + health ───────────────────────────────
- name: Colima + Docker (with brew on the PATH)
  environment:
    PATH: "{{ _brew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  block:
    - name: Create the Colima VM with the specs (first time only)
      ansible.builtin.command:
        cmd: >-
          colima start
          --cpu {{ colima_cpu }}
          --memory {{ colima_memory }}
          --disk {{ colima_disk }}
          --vm-type {{ _colima_vm_type }}
          {{ '--network-address' if colima_network_address else '' }}
        creates: "{{ ansible_facts['env']['HOME'] }}/.colima/default/colima.yaml"

    # Reconciles the persistent config (~/.colima/default/colima.yaml) on subsequent
    # runs — the `creates:` above makes the start apply only at creation. preferredRoute
    # has no CLI flag, so it's edited directly in the yaml. The nested keys under
    # `network:` have a fixed 2-space indentation (file generated by Colima).
    - name: Apply specs and network to Colima's persistent config
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.colima/default/colima.yaml"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^cpu:', line: "cpu: {{ colima_cpu }}" }
        - { regexp: '^memory:', line: "memory: {{ colima_memory }}" }
        - { regexp: '^disk:', line: "disk: {{ colima_disk }}" }
        - { regexp: '^  address:', line: "  address: {{ colima_network_address | to_json }}" }
        - { regexp: '^  preferredRoute:', line: "  preferredRoute: {{ colima_network_preferred_route | to_json }}" }
        - { regexp: '^rosetta:', line: "rosetta: {{ colima_rosetta | to_json }}" }
        - { regexp: '^nestedVirtualization:', line: "nestedVirtualization: {{ colima_nested_virtualization | to_json }}" }
      notify: Restart Colima

    # brew services start = `launchctl bootstrap`, which fails (error 5) if the agent is
    # already loaded. We check first to be idempotent.
    - name: Is Colima already registered in launchd (autostart)?
      ansible.builtin.command:
        cmd: "launchctl print gui/{{ ansible_facts['user_uid'] }}/homebrew.mxcl.colima"
      register: _colima_agent
      changed_when: false
      failed_when: false

    - name: Enable Colima autostart at boot (LaunchAgent via brew services)
      ansible.builtin.command:
        cmd: brew services start colima
      when: _colima_agent.rc != 0
      register: _brew_services
      changed_when: "'Successfully started' in _brew_services.stdout"

    # Handlers would only run at the end of the play; we force them here so the check
    # below already tests the VM with the final config (specs/network applied).
    - name: Apply pending Colima restart before verifying
      ansible.builtin.meta: flush_handlers

    - name: Verify that Docker is responding
      ansible.builtin.command:
        cmd: docker info
      register: _docker_info
      changed_when: false
      retries: 12
      delay: 5
      until: _docker_info.rc == 0
