---
# Provisions the SSH key pair (the user's identity) on the Mac Mini and makes the macmini
# use the key FILE instead of the 1Password agent.
#
# The key is read from 1Password ON THE CONTROLLER (laptop) at runtime, via `op` (pipe lookup):
# no plaintext key in the repo. Prerequisites:
#   - controller: `op` (1Password CLI) authenticated (`op signin`) and the op:// item accessible
#   - macmini: python3 (Command Line Tools) — required for the Ansible modules

- name: Read the key pair from 1Password (on the controller)
  ansible.builtin.set_fact:
    _ssh_private_key: "{{ lookup('pipe', 'op read ' ~ ((op_ssh_item ~ '/private key?ssh-format=openssh') | quote)) }}"
    _ssh_public_key: "{{ lookup('pipe', 'op read ' ~ ((op_ssh_item ~ '/public key') | quote)) }}"
  no_log: true # the private key never appears in the output

- name: Validate reading the keys from 1Password
  ansible.builtin.assert:
    that:
      - _ssh_private_key | length > 100
      - _ssh_public_key.startswith('ssh-')
    fail_msg: >-
      Could not read the key from 1Password ({{ op_ssh_item }}). Check that `op`
      is authenticated (op signin) and the item is accessible on the controller.
    quiet: true # doesn't print the conditions (avoids leaking the value)

- name: Ensure ~/.ssh directory (0700)
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    mode: "0700"

- name: Install the private key (0600)
  ansible.builtin.copy:
    dest: "~/.ssh/{{ ssh_key_filename }}"
    content: "{{ _ssh_private_key }}\n"
    mode: "0600"
  no_log: true

- name: Install the public key (0644)
  ansible.builtin.copy:
    dest: "~/.ssh/{{ ssh_key_filename }}.pub"
    content: "{{ _ssh_public_key }}\n"
    mode: "0644"

# The dotfiles install ~/.ssh/config with `Host * → IdentityAgent <1Password>` (headless,
# no GUI, the agent isn't available). We prepend a `Host *` block that turns off the
# agent and forces the key file. In ssh_config the FIRST value of each option wins,
# so `IdentityAgent none` (here, at the top) beats the dotfiles' IdentityAgent below.
- name: Override ~/.ssh/config — use the key file, not the 1Password agent
  ansible.builtin.blockinfile:
    path: "~/.ssh/config"
    create: true
    mode: "0600"
    insertbefore: BOF
    marker: "# {mark} ANSIBLE macmini — chaves SSH"
    block: |
      Host *
        IdentityAgent none
        IdentityFile ~/.ssh/{{ ssh_key_filename }}
        IdentitiesOnly yes
