---
# Homebrew refuses to run as root → no become. brew's bash 5 lives at
# {prefix}/bin/bash; the scripts pick it up via PATH (the system /bin/bash stays at 3.2).
- name: Install base tools (Homebrew)
  community.general.homebrew:
    name: "{{ prepare_brew_packages }}"
    state: present
    update_homebrew: true
