---
# Base tools for the project's scripts (dotfiles home/.bin), via Homebrew.
# (For a Linux host, add a tasks/Debian.yml with the equivalent apt list.)
prepare_brew_packages:
  - bash # macOS ships bash 3.2 (2007); the scripts use bash 4+/5 features
  - curl
  - ripgrep # rg
  - fd # fd
  - sd # sd
  - bat # bat
