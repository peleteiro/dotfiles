# Ansible config to provision the Mac Mini (runs from the laptop → macmini via SSH).
# Project-scoped: ansible-playbook reads this file when run from inside ./ansible.
[defaults]
inventory = inventory.ini
roles_path = roles
# macOS ships python3 via Command Line Tools; auto_silent discovers it without a warning.
interpreter_python = auto_silent
# Don't pollute stdout with facts we don't use here.
gathering = explicit

[ssh_connection]
# Reuses SSH connections (faster across multiple tasks).
pipelining = true
