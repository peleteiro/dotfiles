# Config do Ansible para provisionar o Mac Mini (roda do laptop → macmini via SSH).
# Escopo project-scoped: o ansible-playbook lê este arquivo quando rodado de dentro de ./ansible.
[defaults]
inventory = inventory.ini
roles_path = roles
# macOS traz python3 via Command Line Tools; auto_silent descobre sem warning.
interpreter_python = auto_silent
# Não polui stdout com facts que não usamos aqui.
gathering = explicit

[ssh_connection]
# Reaproveita conexões SSH (mais rápido em múltiplas tasks).
pipelining = true
