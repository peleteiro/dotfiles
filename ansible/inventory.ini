# Inventory — machines that run agents and home services.
#
# SSH connection laptop → machine: INBOUND SSH must already work (the laptop's public
# key is already in the machine's authorized_keys). Authentication uses the laptop's
# normal SSH (1Password agent), so we do NOT pin a private_key here.
#
# ⚠️ Adjust `ansible_host` (fixed LAN IP or mDNS/Bonjour name) and `ansible_user`.

[macmini]
mac-mini ansible_host=macmini.casa ansible_user=peleteiro

# ── Groups by OS ─────────────────────────────────────────────────────────────
# Provide a home for OS-specific vars (group_vars/darwin.yml). group_vars/all/
# still applies to all machines.
[darwin:children]
macmini
