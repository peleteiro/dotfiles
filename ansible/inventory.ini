# Inventário — máquinas que rodam agentes e serviços da casa.
#
# Conexão SSH do laptop → máquina: o SSH de ENTRADA já precisa funcionar (a chave
# pública do laptop já está no authorized_keys da máquina). A autenticação usa o SSH
# normal do laptop (agent do 1Password), então NÃO fixamos private_key aqui.
#
# ⚠️ Ajuste `ansible_host` (IP fixo da LAN ou nome mDNS/Bonjour) e `ansible_user`.

[macmini]
mac-mini ansible_host=macmini.casa ansible_user=peleteiro

# ── Grupos por SO ────────────────────────────────────────────────────────────
# Dão um lar para vars específicas de SO (group_vars/darwin.yml). group_vars/all/
# continua valendo para todas as máquinas.
[darwin:children]
macmini
