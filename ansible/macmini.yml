---
# Machine: Mac Mini (runs agents and routines). Imported by site.yml.
#
# gather_facts: true — the docker/macos-autologin roles use facts (OS, architecture, HOME).
# Some tasks escalate privileges (auto-login, removing Docker Desktop): run with `-- -K`
# to provide the sudo password (which also becomes the auto-login password).
- name: Mac Mini base configuration
  hosts: macmini
  gather_facts: true

  roles:
    - ssh-keys # SSH key pair + turns off the 1Password agent
    - prepare # bash, curl and rust CLI tools (rg/fd/sd/bat) for the scripts
    - macos-autologin # auto-login at boot (prerequisite for Colima's headless autostart)
    - macos-nosleep # never sleep (server always on and reachable via SSH)
    - docker # Colima (headless Docker) installed, updated and running; removes Docker Desktop
