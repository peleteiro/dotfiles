---
# TEMPLATE do secrets ÚNICO (todas as máquinas). Copie para `secrets.yml` (mesmo diretório):
#
#   cp group_vars/all/secrets.example.yml group_vars/all/secrets.yml
#
# ⚠️ `secrets.yml` é GITIGNORED — nunca commitado. O Ansible carrega group_vars/all/
#    automaticamente para todos os hosts; cada group_vars/<máquina>.yml mapeia o
#    ansible_become_password para a chave da sua máquina.

# Uma senha de sudo POR MÁQUINA (uma chave <máquina>_become_password por host).
macmini_become_password: "PREENCHA_A_SENHA_DO_MACMINI"
