---
# TEMPLATE for the SINGLE secrets file (all machines). Copy to `secrets.yml` (same directory):
#
#   cp group_vars/all/secrets.example.yml group_vars/all/secrets.yml
#
# ⚠️ `secrets.yml` is GITIGNORED — never committed. Ansible loads group_vars/all/
#    automatically for all hosts; each group_vars/<machine>.yml maps
#    ansible_become_password to its machine's key.

# One sudo password PER MACHINE (one <machine>_become_password key per host).
macmini_become_password: "FILL_IN_THE_MACMINI_PASSWORD"
