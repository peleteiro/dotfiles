---
# Variables shared by ALL machines.
# These are NOT secrets — just op:// pointers (the key's value is resolved at runtime, on
# the controller, via `op read`). The same SSH identity is deposited on every machine.

# 1Password item holding the SSH key pair ("SSH Key" type).
# List yours with: `op item list --categories "SSH Key"`.
op_ssh_item: "op://Employee/Peleteiro SSH Key"

# Name of the files generated in ~/.ssh (the key is ed25519).
ssh_key_filename: "id_ed25519"
