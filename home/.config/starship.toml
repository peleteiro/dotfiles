# Starship prompt configuration
# Catppuccin Mocha pastel palette (matches Zellij theme)

format = """
$directory\
$git_branch\
$character
"""

# Directory module — Mocha green (mint pastel)
[directory]
style = "bold #a6e3a1"
truncation_length = 0  # Show full path (like \w in bash)
truncate_to_repo = false

# Git branch module — Mocha blue (sky pastel)
[git_branch]
symbol = ""
style = "bold #89b4fa"
format = "[$branch]($style)"

# Character module — Mocha text on success, rose pastel on error
[character]
success_symbol = '[\$](bold #cdd6f4)'
error_symbol = '[\$](bold #f38ba8)'
